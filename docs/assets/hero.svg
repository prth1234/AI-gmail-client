<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" role="img" aria-labelledby="ag-hero-title ag-hero-desc">
  <title id="ag-hero-title">AI Gmail Client</title>
  <desc id="ag-hero-desc">Lightweight Python Gmail client that authenticates via OAuth 2.0, extracts recursive MIME HTML, and outputs a styled index.html.</desc>
  <style>
    .ag-hero-root {
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .ag-hero-eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      fill: #ea4335;
    }
    .ag-hero-display {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
      fill: #f3f4f6;
    }
    .ag-hero-accent {
      fill: #ea4335;
    }
    .ag-hero-sub {
      font-size: 15px;
      fill: #9ca3af;
    }
    .ag-hero-pill {
      fill: none;
      stroke: #374151;
      stroke-width: 1.2;
    }
    .ag-hero-pill-red {
      fill: none;
      stroke: #ea4335;
      stroke-width: 1.2;
    }
    .ag-hero-pill-text {
      font-size: 13px;
      font-weight: 500;
      fill: #d1d5db;
    }
    .ag-hero-pill-text-red {
      font-size: 13px;
      font-weight: 600;
      fill: #ea4335;
    }
    .ag-hero-dot {
      animation: ag-hero-pulse 2.6s ease-in-out infinite;
    }
    @keyframes ag-hero-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-color-scheme: light) {
      .ag-hero-display { fill: #333333; }
      .ag-hero-sub { fill: #555555; }
      .ag-hero-pill { stroke: #cccccc; }
      .ag-hero-pill-text { fill: #333333; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ag-hero-dot { animation: none; }
    }
  </style>

  <g class="ag-hero-root" transform="translate(24, 32)">
    <circle class="ag-hero-dot" cx="6" cy="10" r="4.5" fill="#ea4335" />
    <text class="ag-hero-eyebrow" x="20" y="15">PYTHON 3.6+ / GMAIL API / OAUTH 2.0</text>

    <text class="ag-hero-display" x="0" y="76">
      AI <tspan class="ag-hero-accent">Gmail</tspan> Client
    </text>

    <text class="ag-hero-sub" x="0" y="114">
      Minimal Python script that fetches your latest Gmail messages, extracts recursive MIME HTML, and renders index.html.
    </text>

    <g transform="translate(0, 146)">
      <rect class="ag-hero-pill-red" x="0" y="0" width="112" height="32" rx="6" />
      <text class="ag-hero-pill-text-red" x="56" y="21" text-anchor="middle">Gmail v1</text>

      <rect class="ag-hero-pill" x="124" y="0" width="136" height="32" rx="6" />
      <text class="ag-hero-pill-text" x="192" y="21" text-anchor="middle">OAuth :8080</text>

      <rect class="ag-hero-pill" x="272" y="0" width="136" height="32" rx="6" />
      <text class="ag-hero-pill-text" x="340" y="21" text-anchor="middle">MIME Parser</text>

      <rect class="ag-hero-pill" x="420" y="0" width="128" height="32" rx="6" />
      <text class="ag-hero-pill-text" x="484" y="21" text-anchor="middle">index.html</text>
    </g>
  </g>
</svg>
